name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: raika-souza
  PORTA: 22

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" || {
            echo "::error::O segredo DEPLOY_KEY está vazio ou não está disponível."
            exit 1
          }

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_KEY" |
            sed 's/\r$//' > "$HOME/.ssh/deploy"
          chmod 600 "$HOME/.ssh/deploy"

          ssh-keygen -y -f "$HOME/.ssh/deploy" >/dev/null || {
            echo "::error::DEPLOY_KEY não contém uma chave privada SSH válida."
            exit 1
          }

      - name: Testar conexão SSH
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
        run: |
          set -Eeuo pipefail
          ssh -T \
            -i "$HOME/.ssh/deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -p "$PORTA" \
            "gr-${SLUG}@gr.lab.ayty.org" \
            gr-docker meus

      - name: Derrubar a topologia antiga
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 -p "$PORTA" "gr-${SLUG}@gr.lab.ayty.org" gr-docker rm -f front api banco 2>/dev/null || true

      - name: Criar rede e volume
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 -p "$PORTA" "gr-${SLUG}@gr.lab.ayty.org" gr-docker network create dados --internal 2>/dev/null || true
          ssh -T -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 -p "$PORTA" "gr-${SLUG}@gr.lab.ayty.org" gr-docker network create web 2>/dev/null || true
          ssh -T -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 -p "$PORTA" "gr-${SLUG}@gr.lab.ayty.org" gr-docker volume create pgdata 2>/dev/null || true

      - name: Subir banco, API e front
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
          DB_SENHA: ${{ secrets.DB_SENHA }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(
            -T
            -i "$HOME/.ssh/deploy"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -p "$PORTA"
          )
          HOST="gr-${SLUG}@gr.lab.ayty.org"

          run_remote() {
            local command="$1"
            local attempt

            for attempt in 1 2 3; do
              if ssh "${SSH_OPTS[@]}" "$HOST" "$command"; then
                return 0
              fi

              echo "Conexão SSH instável. Nova tentativa em 10 segundos..."
              sleep 10
            done

            echo "::error::Não foi possível conectar a $HOST na porta $PORTA após 3 tentativas."
            return 1
          }

          echo "Subindo banco"
          run_remote "gr-docker run banco -e POSTGRES_PASSWORD='${DB_SENHA}'"

          echo "Subindo API"
          run_remote "gr-docker run api -e DB_SENHA='${DB_SENHA}'"

          echo "Subindo front"
          run_remote "gr-docker run front -e DEPLOY_SHA='${DEPLOY_SHA}'"

      - name: Conferir que subiu
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 -p "$PORTA" "gr-${SLUG}@gr.lab.ayty.org" gr-docker meus
