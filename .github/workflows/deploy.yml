name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: raika-souza
  PORTA: 23260

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          # Remove retornos de carro e garante que termina com quebra de linha
          tr -d '\r' < ~/.ssh/deploy > ~/.ssh/deploy_clean
          echo "" >> ~/.ssh/deploy_clean
          mv ~/.ssh/deploy_clean ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -p 22126 -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Diagnosticar chave
        run: |
          echo "Tamanho da chave:"
          wc -c ~/.ssh/deploy
          echo "Primeira linha:"
          head -n 1 ~/.ssh/deploy

      - name: Derrubar a topologia antiga
        run: |
          ssh -i ~/.ssh/deploy -p 22126 gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker rm -f front api banco 2>/dev/null || true

      - name: Criar rede e volume
        run: |
          ssh -i ~/.ssh/deploy -p 22126 gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network create dados --internal 2>/dev/null || true
          ssh -i ~/.ssh/deploy -p 22126 gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network create web 2>/dev/null || true
          ssh -i ~/.ssh/deploy -p 22126 gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker volume create pgdata 2>/dev/null || true

      - name: Subir banco, API e front
        run: |
          ssh -i ~/.ssh/deploy -p 22126 gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run banco -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }}
          ssh -i ~/.ssh/deploy -p 22126 gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run api -e DB_SENHA=${{ secrets.DB_SENHA }}
          ssh -i ~/.ssh/deploy -p 22126 gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run front -e DEPLOY_SHA=${{ github.sha }}

      - name: Conferir que subiu
        run: |
          ssh -i ~/.ssh/deploy -p 22126 gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker meus
