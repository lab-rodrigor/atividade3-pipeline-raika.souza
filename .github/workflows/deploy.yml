name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: raika-souza
  PORTA: 22

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" || {
            echo "::error::O segredo DEPLOY_KEY está vazio ou não está disponível."
            exit 1
          }

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_KEY" |
            sed 's/\r$//' > "$HOME/.ssh/deploy"
          chmod 600 "$HOME/.ssh/deploy"

          ssh-keygen -y -f "$HOME/.ssh/deploy" >/dev/null || {
            echo "::error::DEPLOY_KEY não contém uma chave privada SSH válida."
            exit 1
          }

      - name: Executar Deploy via SSH
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
          DB_SENHA: ${{ secrets.DB_SENHA }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(
            -T
            -i "$HOME/.ssh/deploy"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o BatchMode=yes
            -o ConnectTimeout=30
            -p "$PORTA"
          )
          HOST="gr-${SLUG}@gr.lab.ayty.org"

          echo "Derrubando topologia antiga"
          ssh "${SSH_OPTS[@]}" "$HOST" "gr-docker rm -f front api banco 2>/dev/null || true"

          echo "Criando redes e volume"
          ssh "${SSH_OPTS[@]}" "$HOST" "gr-docker network create dados --internal 2>/dev/null || true"
          ssh "${SSH_OPTS[@]}" "$HOST" "gr-docker network create web 2>/dev/null || true"
          ssh "${SSH_OPTS[@]}" "$HOST" "gr-docker volume create pgdata 2>/dev/null || true"

          echo "Subindo banco"
          ssh "${SSH_OPTS[@]}" "$HOST" "gr-docker run banco -e POSTGRES_PASSWORD='${DB_SENHA}'"

          echo "Subindo API"
          ssh "${SSH_OPTS[@]}" "$HOST" "gr-docker run api -e DB_SENHA='${DB_SENHA}'"

          echo "Subindo front"
          ssh "${SSH_OPTS[@]}" "$HOST" "gr-docker run front -e DEPLOY_SHA='${DEPLOY_SHA}'"

          echo "Conferindo containers ativos"
          ssh "${SSH_OPTS[@]}" "$HOST" "gr-docker meus"
