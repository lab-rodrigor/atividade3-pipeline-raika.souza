name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: raika-souza
  PORTA: 23260

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" || {
            echo "::error::O segredo DEPLOY_KEY está vazio ou não está disponível."
            exit 1
          }

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_KEY" |
            sed 's/\r$//' > "$HOME/.ssh/deploy"
          chmod 600 "$HOME/.ssh/deploy"

          ssh-keygen -y -f "$HOME/.ssh/deploy" >/dev/null || {
            echo "::error::DEPLOY_KEY não contém uma chave privada SSH válida."
            exit 1
          }

      - name: Testar conexão SSH
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/deploy" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -p "$PORTA" \
            "gr-${SLUG}@gr.lab.ayty.org" \
            'echo "SSH OK"'

      - name: Derrubar a topologia antiga
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
        run: |
          ssh -i "$HOME/.ssh/deploy" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15 -p "$PORTA" "gr-${SLUG}@gr.lab.ayty.org" gr-docker rm -f front api banco 2>/dev/null || true

      - name: Criar rede e volume
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
        run: |
          ssh -i "$HOME/.ssh/deploy" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15 -p "$PORTA" "gr-${SLUG}@gr.lab.ayty.org" gr-docker network create dados --internal 2>/dev/null || true
          ssh -i "$HOME/.ssh/deploy" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15 -p "$PORTA" "gr-${SLUG}@gr.lab.ayty.org" gr-docker network create web 2>/dev/null || true
          ssh -i "$HOME/.ssh/deploy" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15 -p "$PORTA" "gr-${SLUG}@gr.lab.ayty.org" gr-docker volume create pgdata 2>/dev/null || true

      - name: Subir banco, API e front
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
          DB_SENHA: ${{ secrets.DB_SENHA }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(
            -i "$HOME/.ssh/deploy"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o BatchMode=yes
            -o ConnectTimeout=15
            -p "$PORTA"
          )
          HOST="gr-${SLUG}@gr.lab.ayty.org"

          echo "Subindo banco"
          ssh "${SSH_OPTS[@]}" "$HOST" \
            "gr-docker run banco -e POSTGRES_PASSWORD='${DB_SENHA}'"

          echo "Subindo API"
          ssh "${SSH_OPTS[@]}" "$HOST" \
            "gr-docker run api -e DB_SENHA='${DB_SENHA}'"

          echo "Subindo front"
          ssh "${SSH_OPTS[@]}" "$HOST" \
            "gr-docker run front -e DEPLOY_SHA='${DEPLOY_SHA}'"

      - name: Conferir que subiu
        env:
          PORTA: ${{ env.PORTA }}
          SLUG: ${{ env.SLUG }}
        run: |
          ssh -i "$HOME/.ssh/deploy" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15 -p "$PORTA" "gr-${SLUG}@gr.lab.ayty.org" gr-docker meus
